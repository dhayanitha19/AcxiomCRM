{% extends 'layout.html' %}
{% block auth_content %}
<section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Sign in</h1>
  <p class="muted">Use your AcxiomCRM account to continue.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3"><label for="email" class="form-label">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="username" maxlength="160" required><div class="invalid-feedback">Enter a valid email address.</div></div>
    <div class="mb-3"><label for="password" class="form-label">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><div class="invalid-feedback">Password is required.</div></div>
    <button class="btn btn-primary w-100 mt-2" type="submit">Sign in</button>
  </form>
  <div class="auth-divider"></div>
  <p class="small mb-0">First time here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
